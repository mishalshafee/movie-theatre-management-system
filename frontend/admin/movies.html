<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Movie Management · CineLux</title>
  <meta name="description" content="CineLux admin — manage the movie catalogue.">
  <meta name="theme-color" content="#0B1020">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header id="admin-header"></header>
      <main class="admin-content page-enter">
        <div class="admin-toolbar">
          <div class="admin-toolbar__filters">
            <div class="movies-toolbar__search" style="max-width:320px;flex:1">
              <span aria-hidden="true">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              </span>
              <input type="search" class="form-input" id="movie-search" placeholder="Search movies…" aria-label="Search movies">
            </div>
          </div>
          <button type="button" class="btn btn--primary" id="add-movie">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add Movie
          </button>
        </div>

        <div class="table-wrap" id="movies-table-wrap" aria-busy="true"></div>
        <div id="movies-pagination"></div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/admin/movies.js"></script>
</body>
</html>
