<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Screen Management · CineLux</title>
  <meta name="description" content="CineLux admin — manage auditoriums and seat layouts.">
  <meta name="theme-color" content="#0B1020">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header id="admin-header"></header>
      <main class="admin-content page-enter">
        <div class="admin-toolbar">
          <p class="movies-toolbar__count" id="screens-summary" aria-live="polite"></p>
          <button type="button" class="btn btn--primary" id="add-screen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Create Screen
          </button>
        </div>

        <div class="table-wrap" id="screens-table-wrap" aria-busy="true"></div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/admin/screens.js"></script>
</body>
</html>
