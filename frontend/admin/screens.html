<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Screens · CineLux</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body">
  <a class="skip-link" href="#main">Skip to content</a>

  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <div class="admin-overlay" data-admin-overlay hidden></div>

  <div class="admin-main">
    <header id="admin-header"></header>
    <main id="main" class="admin-content">
      <div class="admin-toolbar">
        <p class="admin-toolbar__hint">Screens are auditoriums with a fixed seat layout. The PATCH endpoint renames only — layouts are immutable once created.</p>
        <button type="button" class="btn btn--primary" id="add-screen-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Add screen
        </button>
      </div>

      <section class="screens-grid" id="screens-grid" aria-label="Cinema screens"></section>
    </main>
  </div>

  <script type="module" src="../js/admin/screens.js"></script>
</body>
</html>
