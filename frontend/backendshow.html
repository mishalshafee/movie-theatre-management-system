<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Monitor backend API server and database connection health status in real time.">
    <title>Backend Connection Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0f1a;
            overflow: hidden;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 80%, rgba(0, 210, 255, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 20%, rgba(128, 0, 255, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(0, 230, 118, 0.06) 0%, transparent 60%);
            animation: bgShift 12s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes bgShift {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.1) translate(-2%, 3%); }
            100% { transform: scale(1) translate(2%, -2%); }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            border-radius: 50%;
            background: rgba(0, 210, 255, 0.15);
            pointer-events: none;
            animation: float linear infinite;
            z-index: 0;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Monitor card — glassmorphism */
        .monitor-card {
            position: relative;
            z-index: 1;
            width: 460px;
            max-width: 92vw;
            background: rgba(26, 26, 46, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px 36px 36px;
            box-shadow:
                0 24px 48px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.04) inset;
            animation: cardEntry 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header */
        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .card-header .icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #00d2ff, #7b2ff7);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.25);
        }

        .card-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .card-header p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            font-weight: 400;
        }

        /* Status rows */
        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            margin-bottom: 14px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .status-row:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .status-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .status-icon.api {
            background: rgba(0, 210, 255, 0.12);
        }

        .status-icon.db {
            background: rgba(123, 47, 247, 0.12);
        }

        .status-label {
            font-size: 15px;
            font-weight: 600;
            color: #e0e0e0;
        }

        .status-sublabel {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 2px;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }

        .badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Connected state */
        .badge.ok {
            background: rgba(0, 230, 118, 0.12);
            color: #00e676;
            border: 1px solid rgba(0, 230, 118, 0.2);
        }

        .badge.ok .dot {
            background: #00e676;
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
        }

        /* Error / Offline state */
        .badge.error {
            background: rgba(255, 23, 68, 0.12);
            color: #ff1744;
            border: 1px solid rgba(255, 23, 68, 0.2);
        }

        .badge.error .dot {
            background: #ff1744;
            box-shadow: 0 0 8px rgba(255, 23, 68, 0.6);
        }

        /* Loading state */
        .badge.loading {
            background: rgba(255, 196, 0, 0.10);
            color: #ffc400;
            border: 1px solid rgba(255, 196, 0, 0.18);
        }

        .badge.loading .dot {
            background: #ffc400;
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* Divider */
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 22px 0;
        }

        /* Timestamp */
        .timestamp {
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
            min-height: 16px;
        }

        /* Refresh button */
        .btn-refresh {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #00d2ff, #7b2ff7);
            color: #ffffff;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-refresh::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 210, 255, 0.3);
        }

        .btn-refresh:hover::before {
            opacity: 1;
        }

        .btn-refresh:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(0, 210, 255, 0.2);
        }

        .btn-refresh.is-loading {
            pointer-events: none;
            opacity: 0.85;
        }

        .btn-refresh .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-refresh.is-loading .spinner {
            display: block;
        }

        .btn-refresh .refresh-icon {
            transition: transform 0.4s ease;
        }

        .btn-refresh:hover .refresh-icon {
            transform: rotate(180deg);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <!-- Floating particles (generated via JS) -->

    <div class="monitor-card">
        <div class="card-header">
            <div class="icon">🔗</div>
            <h1>System Connections</h1>
            <p>Backend &amp; Database Health Monitor</p>
        </div>

        <!-- API Server Status -->
        <div class="status-row">
            <div class="status-info">
                <div class="status-icon api">🌐</div>
                <div>
                    <div class="status-label">API Server Status</div>
                    <div class="status-sublabel">localhost:4000</div>
                </div>
            </div>
            <span id="api-badge" class="badge loading">
                <span class="dot"></span>
                Checking...
            </span>
        </div>

        <!-- Database Status -->
        <div class="status-row">
            <div class="status-info">
                <div class="status-icon db">🗄️</div>
                <div>
                    <div class="status-label">Database Status</div>
                    <div class="status-sublabel">SQLite / PostgreSQL</div>
                </div>
            </div>
            <span id="db-badge" class="badge loading">
                <span class="dot"></span>
                Checking...
            </span>
        </div>

        <div class="divider"></div>

        <div id="last-checked" class="timestamp"></div>

        <button id="refresh-btn" class="btn-refresh" onclick="checkConnections()">
            <span class="spinner"></span>
            <span class="refresh-icon">⟳</span>
            Refresh Connections
        </button>
    </div>

    <script>
        // Create floating particles
        (function createParticles() {
            const count = 18;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                const size = Math.random() * 4 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 12 + 10) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                if (Math.random() > 0.5) {
                    p.style.background = 'rgba(123, 47, 247, 0.15)';
                }
                document.body.appendChild(p);
            }
        })();

        /**
         * Sets a badge to a given state.
         * @param {HTMLElement} badge
         * @param {'ok'|'error'|'loading'} state
         * @param {string} text
         */
        function setBadge(badge, state, text) {
            badge.className = 'badge ' + state;
            // Keep the dot element, update text
            badge.innerHTML = '<span class="dot"></span> ' + text;
        }

        async function checkConnections() {
            const apiBadge = document.getElementById('api-badge');
            const dbBadge = document.getElementById('db-badge');
            const refreshBtn = document.getElementById('refresh-btn');
            const timestamp = document.getElementById('last-checked');

            // Loading state
            setBadge(apiBadge, 'loading', 'Checking...');
            setBadge(dbBadge, 'loading', 'Checking...');
            refreshBtn.classList.add('is-loading');

            try {
                const response = await fetch('http://localhost:4000/api/health');
                const data = await response.json();

                // Update API Server badge
                if (data.status === 'ok') {
                    setBadge(apiBadge, 'ok', 'Connected');
                } else {
                    setBadge(apiBadge, 'error', 'Error');
                }

                // Update Database badge
                if (data.db === 'ok') {
                    setBadge(dbBadge, 'ok', 'Connected');
                } else {
                    setBadge(dbBadge, 'error', 'Error');
                }
            } catch (error) {
                // Both services are unreachable
                setBadge(apiBadge, 'error', 'Offline');
                setBadge(dbBadge, 'error', 'Offline');
                console.error('Connection failed:', error);
            }

            // Update timestamp
            const now = new Date();
            timestamp.textContent = 'Last checked: ' + now.toLocaleTimeString();

            // Remove loading from button
            refreshBtn.classList.remove('is-loading');
        }

        // Auto-check on page load
        checkConnections();
    </script>
</body>

</html>
