<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password – ShowBook</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="center">
<form class="glass auth" id="ForgotForm">
<h1>Forgot Password?</h1>
<p class="sub">Enter your email and we'll send you a link to reset your password.</p>

<label for="email">Email</label>
<input type="email" id="email" name="email" autocomplete="email" required>

<button class="btn" type="submit">Send Reset Link</button>
<p id="message" class="form-message" role="status" aria-live="polite"></p>
<p class="foot">Remember your password? <a href="login.html">Back to log in</a></p>
</form>
<script src="app.js"></script>
</body>
</html>
