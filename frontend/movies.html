<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies · CineLux</title>
  <meta name="description" content="Browse every CineLux movie — now showing and coming soon — with live showtimes and instant seat booking.">
  <meta name="theme-color" content="#0B1020">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/movies.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main" class="page-enter">
    <header class="page-hero container container--wide">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span class="breadcrumbs__sep" aria-hidden="true">/</span>
        <span aria-current="page">Movies</span>
      </nav>
      <p class="section-eyebrow">The full catalogue</p>
      <h1 class="page-hero__title">Every Movie, One Screen Away</h1>
      <p class="page-hero__sub">Browse what is playing right now and what is arriving soon. Showtimes and seats come live from the cinema backend.</p>
    </header>

    <section class="section" style="padding-top: 0; padding-bottom: clamp(3.5rem, 7vw, 6rem);">
      <div class="container container--wide">
        <div class="movies-toolbar" data-reveal>
          <div class="movies-toolbar__filters" role="tablist" aria-label="Filter movies by status">
            <div class="segmented" id="status-filter">
              <button type="button" class="segmented__btn" data-status="" role="tab">All Movies</button>
              <button type="button" class="segmented__btn" data-status="now_showing" role="tab">Now Showing</button>
              <button type="button" class="segmented__btn" data-status="coming_soon" role="tab">Coming Soon</button>
            </div>
            <div class="movies-toolbar__search">
              <span aria-hidden="true">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              </span>
              <input type="search" class="form-input" id="movie-search" placeholder="Search by title…" aria-label="Search movies by title" autocomplete="off">
            </div>
          </div>
          <span class="movies-toolbar__count" id="movies-count" aria-live="polite"></span>
        </div>

        <div id="movies-grid" class="movie-grid" aria-busy="true"></div>
        <div id="movies-pagination"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="js/pages/movies.js"></script>
</body>
</html>
